name: publish autodoc

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: version to be published
        required: false
        type: string

jobs:
  publish:
    uses: sovity/core-edc-github/.github/workflows/publish-autodoc.yml@sovity-0.7.2.x-main
    secrets: inherit
    with:
      version: ${{ github.event.inputs.version }}
