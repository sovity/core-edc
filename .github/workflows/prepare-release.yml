name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: the version to be released. If it ends with '.0' a proper release is created, bugfix otherwise
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: the version to be released. If it ends with '.0' a proper release is created, bugfix otherwise
        required: true
        type: string

jobs:
  Prepare-Release:
    uses: sovity/core-edc-github/.github/workflows/core-prepare-release.yml@0.11.1_2025-03-10_2
    secrets: inherit
    with:
      version: ${{ inputs.version }}
