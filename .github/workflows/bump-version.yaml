---
name: "Bump version (manually)"

on:
  # can be called manually from GH webpage
  workflow_dispatch:
    inputs:
      target_branch:
        default: 'main'
        description: "Branch on which the version bump is to be done."
        required: false


jobs:
  Bump-Version:
    name: 'Update snapshot version'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: sovity/core-edc-github/.github/actions/bump-version@2a8d5ee91db61fa80792b75cd9f821179a17e683 #0.11.1_2025-03-10
        name: Bump version
        with:
          target_branch: ${{ inputs.target_branch }}
